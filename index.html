<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Enigma Binário do José</title>
<style>
    :root {
        --lilas-claro: #e6e6fa;
        --lilas-medio: #c8a2c8;
        --lilas-escuro: #9370db;
        --rosa-claro: #fff0f5;
        --rosa-forte: #ff69b4;
        --grafite: #333333;
    }

    body {
        font-family: 'Comic Sans MS', 'Segoe UI', cursive, sans-serif;
        background-color: #f9f9f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
    }

    /* CONTAINER DO QUADRO */
    #quadro-container {
        width: 90%;
        max-width: 600px;
        background: white;
        padding: 40px;
        border: 12px solid var(--lilas-medio);
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        position: relative;
        text-align: center;
    }

    #caixa-texto {
        min-height: 250px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        color: var(--grafite);
        font-size: 1.15rem;
        line-height: 1.6;
        transition: opacity 0.5s ease;
    }

    .destaque-rosa {
        color: var(--rosa-forte);
        font-weight: bold;
    }

    .destaque-lilas {
        color: var(--lilas-escuro);
        font-weight: bold;
    }

    .codigo-binario {
        background: var(--rosa-claro);
        padding: 5px 15px;
        border-radius: 8px;
        font-family: 'Courier New', monospace;
        letter-spacing: 3px;
        border: 1px dashed var(--rosa-forte);
        display: inline-block;
        margin: 10px 0;
    }

    #btn-navegar {
        background-color: var(--lilas-escuro);
        color: white;
        border: none;
        padding: 15px 35px;
        font-size: 1rem;
        border-radius: 50px;
        cursor: pointer;
        margin-top: 25px;
        transition: background 0.3s, transform 0.2s;
        box-shadow: 0 4px 10px rgba(147, 112, 219, 0.3);
    }

    #btn-navegar:hover {
        background-color: var(--rosa-forte);
        transform: translateY(-2px);
    }

    #btn-navegar:active {
        transform: translateY(0);
    }

    /* ELEMENTOS DECORATIVOS */
    .detalhe {
        position: absolute;
        font-size: 2rem;
        opacity: 0.2;
    }
</style>
</head>
<body>

<div id="quadro-container">
    <!-- Decoração de cantos -->
    <div class="detalhe" style="top: 10px; left: 10px; color: var(--rosa-forte);">01</div>
    <div class="detalhe" style="bottom: 10px; right: 10px; color: var(--lilas-escuro);">10</div>

    <div id="caixa-texto">
        Avançamos no primeiro e no segundo número do misterioso CPF do José!! <br><br>
        A titia faltante mandou muito bem ao descobrir esses 2 números. Parabéns, titia!!
    </div>

    <button id="btn-navegar" onclick="proximo()">Seguir para o 3º Número</button>
</div>

<script>
    const falas = [
        "Hoje, José resolveu 'baixar a régua'! O enigma agora é nível Ensino Fundamental 1 para descobrir o terceiro número do CPF.",

        "<strong>Dica 1:</strong> A senhora aprendeu a estratégia de somar os primeiros números das tabelas para achar o valor escolhido. Hoje, vamos entender o que está 'por trás dos panos'!",

        "<strong>Dica 2:</strong> Quando escrevemos 19, fazemos: <br> <span class='destaque-lilas'>19 = 1 • 10 + 9 • 1</span>. <br>Isso é a nossa base decimal.",

        "<strong>Dica 3:</strong> Agora usaremos a <strong>Base Binária</strong>. <br> Se temos <span class='codigo-binario'>0 1 0 1</span>, o valor é: <br> 2³ • 0 + 2² • 1 + 2¹ • 0 + 2⁰ • 1 = <span class='destaque-rosa'>5</span>",

        "<strong>Dica 4:</strong> O terceiro dígito é um número <strong>primo</strong>. <br> Converta este binário: <br> <span class='codigo-binario'>0 1 1 1</span>",

        "<strong>Dica 5:</strong> A senhora já teve esse número na idade 3 vezes, mas nunca teve ele repetido (como o 22).",

        "<strong>Dica Extra do Efraim:</strong> <br> <span class='codigo-binario'>0 1 1 1</span> = <br> 2³ • 0 + 2² • 1 + 2¹ • 1 + 2⁰ • 1",

        "É isso! Espero que a senhora descubra... <br><br> <span class='destaque-lilas'>Fico esperando a resposta no WhatsApp!!</span>"
    ];

    let indice = 0;
    const caixaTexto = document.getElementById('caixa-texto');
    const btn = document.getElementById('btn-navegar');

    function proximo() {
        caixaTexto.style.opacity = "0";

        setTimeout(() => {
            if (indice < falas.length) {
                caixaTexto.innerHTML = falas[indice];
                btn.innerText = (indice === falas.length - 1) ? "Reiniciar" : "Continuar Enigma";
                indice++;
            } else {
                indice = 0;
                caixaTexto.innerHTML = "Avançamos no primeiro e no segundo número do misterioso CPF do José!! <br><br> A titia faltante mandou muito bem! Parabéns, titia!!";
                btn.innerText = "Seguir para o 3º Número";
            }
            caixaTexto.style.opacity = "1";
        }, 500);
    }
</script>

</body>
</html>
